# Intégration continue Iris.
#
# Raison d'être : une branche a déjà été poussée sans que ni le front ni le back ne
# compile, parce que rien n'obligeait à lancer les commandes avant de committer. Ce
# workflow les lance à chaque poussée et à chaque pull request : une branche qui ne
# construit pas, ou dont un test échoue, ne peut plus être fusionnée sans que ce soit vu.
#
# Cinq travaux indépendants, pour que l'échec désigne tout de suite le coupable :
#   - compose   : gardes d'identifiants PostgreSQL et résolution de la stack ;
#   - backend   : génération Prisma, compilation TypeScript et liste des routes ;
#   - tests     : migrations et suite complète contre un vrai PostgreSQL 16 ;
#   - frontend  : compilation TypeScript stricte, build Vite et lint ;
#   - parcours  : parcours navigateur contre la SPA, l'API et PostgreSQL.
# Encadrés par deux travaux légers :
#   - perimetre : fichiers changés, contrôles d'une série de documentation seule, arbre déjà attesté ;
#   - synthese  : statut unique de la série, celui que regarde la fusion (« CI — synthèse »).
#
# Consommation (décision de Nelson du 14-11-2026 : dépôt privé, 2 000 minutes par mois, « sans affaiblir les
# contrôles ») : une série complète coûte une cinquantaine de minutes facturables, presque toutes dans `parcours` et
# `tests`. Les travaux lourds ne tournent donc pas :
#   - pour une série qui ne porte que de la documentation (`docs/**`, fichiers `*.md`, `LICENSE`, hors client/src,
#     client/public et server/prisma) ; les seuls tests qui lisent ces fichiers tournent alors dans `perimetre` ;
#   - pour un push sur `main` dont l'arbre exact est attesté par la série réussie de la PR fusionnée (la fusion par
#     commit de fusion d'une PR dont la base n'a pas bougé reproduit l'arbre testé, `refs/pull/N/merge`), sauf si
#     le push touche `.github/**`.
# Ils apparaissent alors « skipped », et la synthèse est verte par un chemin exact. Quand ils tournent, leurs contrôles
# sont inchangés. Logique et tests : .github/scripts/perimetre-ci.mjs et perimetre-ci.test.mjs.
name: CI

# `push` est limité à main, `pull_request` couvre les branches de travail. Déclencher sur
# les deux pour toute branche lançait la série DEUX FOIS par commit dès qu'une pull request
# était ouverte : la clé de concurrence diffère entre un push (refs/heads/…) et une pull
# request (refs/pull/N/merge), les deux séries ne s'annulaient donc pas l'une l'autre.
#
# Conséquence assumée : une branche sans pull request n'est pas vérifiée. Elle le sera dès
# l'ouverture de la pull request, c'est-à-dire avant toute fusion — le moment qui compte.
on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée sur la même pull request annule sa série précédente : inutile de payer pour un code déjà
# remplacé. Une série de `main` n'est jamais annulée ni remplacée en attente (un groupe par commit) : elle va au bout,
# et son arbre est attesté ou rouge ; la série suivante peut s'appuyer sur cette attestation.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `actions: read` : `perimetre` lit les artefacts qui attestent un arbre, et la série qui les a déposés. Rien d'autre.
permissions:
  contents: read
  actions: read

jobs:
  perimetre:
    name: Périmètre des changements
    runs-on: ubuntu-24.04
    outputs:
      arbre: ${{ steps.perimetre.outputs.arbre }}
      documentation_seule: ${{ steps.perimetre.outputs.documentation_seule }}
      deja_validee: ${{ steps.perimetre.outputs.deja_validee }}
      lourds: ${{ steps.perimetre.outputs.lourds }}
    steps:
      # Profondeur 2 : pour une pull request, le commit testé est le commit de fusion de la PR dans sa base, dont le
      # premier parent est la base ; pour un push sur `main`, le second parent du commit de fusion est la tête de la PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Tests des scripts de la CI
        run: node --test .github/scripts/perimetre-ci.test.mjs
      - name: Fichiers changés et périmètre
        id: perimetre
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          AVANT: ${{ github.event.before }}
          DEPOT: ${{ github.repository }}
          DEPOT_ID: ${{ github.repository_id }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/perimetre-ci.mjs perimetre
      # Documentation seule : les deux seuls tests de la CI qui lisent ces fichiers, sans base. environnement.test.mjs
      # relit docs/CONFIGURATION-ENVIRONNEMENT.md et les modèles .env.example ; les tests unitaires du client
      # comprennent identite.test.ts, qui parcourt server/src et les migrations (où se trouvent des README.md).
      # Un test qui lirait un autre fichier de documentation doit être ajouté ici.
      - uses: actions/setup-node@v4
        if: steps.perimetre.outputs.documentation_seule == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Documentation — variables d'environnement documentées
        if: steps.perimetre.outputs.documentation_seule == 'true'
        run: node --test server/tests/environnement.test.mjs
      - name: Documentation — tests unitaires du client
        if: steps.perimetre.outputs.documentation_seule == 'true'
        working-directory: client
        run: |
          npm ci
          npm run test:unit
      # Les caches d'une pull request ne servent qu'à elle ; ceux de `main` servent à toutes. Sur un push sur `main`,
      # le navigateur n'est installé et mis en cache que s'il manque (changement de version de Playwright). Après le
      # calcul des sorties et sans pouvoir faire échouer ce travail : un incident de téléchargement ne saute pas les
      # travaux lourds.
      - name: Clé du cache du navigateur
        id: cle-navigateur
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          version="$(node -p "require('./client/package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cle=playwright-$ImageOS-$RUNNER_ARCH-$version-chromium" >> "$GITHUB_OUTPUT"
      - name: Cache du navigateur sur main
        id: cache-main
        if: github.event_name == 'push' && steps.cle-navigateur.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cle-navigateur.outputs.cle }}
          lookup-only: true
      - name: Navigateur à mettre en cache
        id: installation-navigateur
        if: github.event_name == 'push' && steps.cache-main.outcome == 'success' && steps.cache-main.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          VERSION_PLAYWRIGHT: ${{ steps.cle-navigateur.outputs.version }}
        run: npx --yes "playwright@$VERSION_PLAYWRIGHT" install chromium
      - name: Enregistrer le cache du navigateur
        if: github.event_name == 'push' && steps.installation-navigateur.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cle-navigateur.outputs.cle }}

  compose:
    name: Docker Compose — gardes PostgreSQL
    needs: perimetre
    # Lancé sauf si le périmètre dit explicitement « false » : une sortie vide ou invalide lance la série complète.
    if: needs.perimetre.outputs.lourds != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Compose s'arrête à la PREMIÈRE interpolation fautive : une résolution qui
      # échoue ne détecte donc pas la perte d'un garde isolé, masquée par un autre.
      # Le contrôle structurel lit chaque interpolation : `:-` réinstalle un repli
      # et `${VAR}` nu se résout en chaîne vide avec un simple avertissement.
      - name: Interdire toute interpolation sans garde
        run: |
          mauvaises="$(grep -noE '\$\{[^}]*\}' docker-compose.yml | grep -vE '\$\{[A-Za-z_][A-Za-z0-9_]*:\?' || true)"
          if [ -n "$mauvaises" ]; then
            echo '::error::Une interpolation de docker-compose.yml ne porte pas de garde `:?`.'
            echo "$mauvaises"
            exit 1
          fi
      # `env_file` est requis par Compose mais ne doit jamais être commité : la CI
      # part donc du modèle et remplace son unique secret d'exemple avant inspection.
      - name: Préparer un environnement applicatif non secret
        run: |
          cp server/.env.example server/.env
          python3 -c "from pathlib import Path; p = Path('server/.env'); p.write_text(p.read_text().replace('CHANGE_ME_GENERATE_A_LONG_RANDOM_SECRET', 'ci_jwt_secret_not_for_production_0123456789'))"
      # Les trois identifiants PostgreSQL doivent être imposés par `:?`. Un repli
      # `${POSTGRES_PASSWORD:-...}` ferait repasser cette commande au vert.
      - name: Refuser les identifiants PostgreSQL absents
        run: |
          if docker compose --env-file /dev/null config > /dev/null 2>&1; then
            echo '::error::Docker Compose accepte des identifiants PostgreSQL absents.'
            exit 1
          fi
      # Avec les trois valeurs injectées, la configuration doit se résoudre et ne
      # doit contenir ni exemple ni ancien repli. La présence de `ci_secret` prouve
      # que le mot de passe provient bien de l'environnement de la CI.
      - name: Résoudre sans valeur d'exemple
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_secret
          POSTGRES_DB: ci
        run: |
          docker compose config > compose.resolved.yml
          if grep -Eq 'CHANGE_ME|iris_password' compose.resolved.yml; then
            echo '::error::Une valeur d’exemple ou un repli interdit est présent dans la configuration Compose.'
            exit 1
          fi
          grep -q 'POSTGRES_PASSWORD: ci_secret' compose.resolved.yml

  backend:
    name: Backend — compilation
    needs: perimetre
    # Lancé sauf si le périmètre dit explicitement « false » : une sortie vide ou invalide lance la série complète.
    if: needs.perimetre.outputs.lourds != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      # `npm ci` et non `npm install` : il installe EXACTEMENT le lockfile et échoue si
      # package.json et package-lock.json divergent. C'est ce qui rend le build reproductible.
      - run: npm ci
      # URL factice : `prisma generate` n'ouvre aucune connexion, il lui faut seulement
      # une valeur syntaxiquement valide.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/iris?schema=public
      - run: npm run build
      # Découpage de server/index.ts par domaine : ce que l'application met en place en se
      # chargeant (lectures de l'environnement avant et après .env, réglages, middlewares,
      # routes dans leur ordre, gardes avec leurs permissions, empreinte de chaque gestionnaire,
      # exports) doit rester celui de scripts/routes-reference.txt. Un lot qui change l'un
      # d'eux réécrit la référence (--ecrire) dans sa propre PR : l'écart apparaît dans son diff.
      - name: Routes identiques à la référence
        run: node scripts/routes.mjs --verifier
      # PR du découpage (branches refactor/serveur-*) : le code ne fait que se déplacer.
      # scripts/verifier-deplacement.mjs compare la PR à sa base, instruction par instruction.
      # Il ne vaut que pour ces PR : un lot fonctionnel le ferait échouer par construction.
      # Les outils de preuve y sont figés, sauf pour une PR d'outils (refactor/serveur-preuves-*).
      - name: Déplacement pur (PR du découpage)
        if: startsWith(github.head_ref, 'refactor/serveur-')
        env:
          BASE: ${{ github.base_ref }}
          OUTILS: ${{ startsWith(github.head_ref, 'refactor/serveur-preuves') && '--outils-admis' || '' }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          node scripts/verifier-deplacement.mjs FETCH_HEAD $OUTILS
      # Le gel des outils ne dépend pas du seul script qu'il protège : hors PR d'outils, ni les
      # scripts de preuve, ni la référence, ni ce workflow ne changent dans une PR du découpage.
      - name: Outils de preuve inchangés (PR du découpage)
        if: startsWith(github.head_ref, 'refactor/serveur-') && !startsWith(github.head_ref, 'refactor/serveur-preuves')
        run: git diff --exit-code FETCH_HEAD -- scripts/routes.mjs scripts/routes-reference.txt scripts/verifier-deplacement.mjs ../.github/workflows/ci.yml

  tests:
    name: Backend — tests
    needs: perimetre
    # Lancé sauf si le périmètre dit explicitement « false » : une sortie vide ou invalide lance la série complète.
    if: needs.perimetre.outputs.lourds != 'false'
    # Version épinglée : c'est l'image Ubuntu 24.04 qui fournit PostgreSQL 16 (voir l'étape
    # PostgreSQL ci-dessous).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgresql://iris:iris_test@localhost:5432/iris_test?schema=public
      TEST_DATABASE_URL: postgresql://iris:iris_test@localhost:5432/iris_test?schema=public
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL préinstallé sur le runner, et non un conteneur de service : le tirage de
      # l'image depuis un registre public échouait par intermittence (« toomanyrequests »)
      # avant tout test. Le script refuse toute autre version majeure que 16 et crée la base
      # en C.UTF-8, l'ordre de tri par point de code de l'image Alpine utilisée auparavant.
      - name: PostgreSQL 16 du runner
        run: ../.github/scripts/postgresql-runner.sh iris_test
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Les migrations sont appliquées comme en production (`migrate deploy`) : une
      # migration écrite à la main mais invalide fait échouer la CI, pas le déploiement.
      - run: npx prisma migrate deploy
      # Vérifie que le schéma Prisma et les migrations décrivent bien la même base. Une
      # dérive silencieuse finit par faire supprimer un index à la migration suivante.
      - name: Dérive entre le schéma et les migrations
        run: |
          DIFF=$(npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --script)
          echo "$DIFF"
          if ! echo "$DIFF" | grep -q "empty migration"; then
            echo "::error::Le schéma Prisma et les migrations ont divergé (voir le script ci-dessus)."
            exit 1
          fi
      # TEST_DATABASE_URL étant défini, les tests HTTP s'exécutent réellement au lieu
      # d'être ignorés.
      - run: npm test
      # Un conteneur de service affichait le journal du serveur à son arrêt ; celui du runner
      # est montré en cas d'échec, pour le diagnostic.
      - name: Journal de PostgreSQL
        if: failure()
        run: sudo tail -n 300 /var/log/postgresql/postgresql-16-main.log

  frontend:
    name: Frontend — build et lint
    needs: perimetre
    # Lancé sauf si le périmètre dit explicitement « false » : une sortie vide ou invalide lance la série complète.
    if: needs.perimetre.outputs.lourds != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # `npm run build` enchaîne `tsc -b` puis `vite build` : c'est exactement ce que fait
      # le Dockerfile, donc un build vert ici garantit une image constructible.
      - run: npm run build
      - run: npm run lint
      - run: npm run test:unit

  parcours:
    name: Frontend — parcours utilisateur
    needs: perimetre
    # Lancé sauf si le périmètre dit explicitement « false » : une sortie vide ou invalide lance la série complète.
    if: needs.perimetre.outputs.lourds != 'false'
    # Même PostgreSQL 16 du runner que le travail `tests`.
    runs-on: ubuntu-24.04
    # Les tests API et jsdom ne reproduisent pas la saisie du navigateur : ce travail
    # pilote Chromium contre la SPA, le proxy Vite, le backend et PostgreSQL.
    env:
      E2E_DATABASE_URL: postgresql://iris:iris_test@localhost:5432/iris_e2e?schema=public
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16 du runner
        run: .github/scripts/postgresql-runner.sh iris_e2e
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Backend — dépendances, schéma et compilation
        working-directory: server
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
      - name: Frontend — dépendances
        working-directory: client
        run: npm ci
      # Navigateur restauré du cache (clé : image du runner, architecture, version de Playwright) ; seules les
      # dépendances système s'installent alors. Sans cache, téléchargement complet, enregistré à la fin du travail.
      - name: Clé du cache du navigateur
        id: cle-navigateur
        run: |
          version="$(node -p "require('./client/package-lock.json').packages['node_modules/@playwright/test'].version")"
          echo "cle=playwright-$ImageOS-$RUNNER_ARCH-$version-chromium" >> "$GITHUB_OUTPUT"
      - name: Cache du navigateur Playwright
        id: cache-navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cle-navigateur.outputs.cle }}
      - name: Navigateur de test
        if: steps.cache-navigateur.outputs.cache-hit != 'true'
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Dépendances système du navigateur
        if: steps.cache-navigateur.outputs.cache-hit == 'true'
        working-directory: client
        run: npx playwright install-deps chromium
      # playwright.config.ts démarre le backend compilé et Vite.
      - name: Parcours E2E
        working-directory: client
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parcours-rapport
          path: client/playwright-report/
          retention-days: 7
      - name: Journal de PostgreSQL
        if: failure()
        run: sudo tail -n 300 /var/log/postgresql/postgresql-16-main.log

  # Statut unique de la série, fermé par défaut : vert seulement si le périmètre a réussi avec des sorties cohérentes,
  # si aucun travail n'a échoué ni été annulé, et si exactement un chemin est rempli : travaux lourds demandés et tous
  # réussis ; documentation seule, travaux lourds sautés ; push sur `main` d'un arbre attesté, travaux lourds sautés.
  # `!cancelled()` : la synthèse tourne après un échec, pour le signaler, mais pas pour une série annulée.
  synthese:
    name: CI — synthèse
    needs: [perimetre, compose, backend, tests, frontend, parcours]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Verdict de la série
        id: verdict
        env:
          EVENEMENT: ${{ github.event_name }}
          RESULTATS: ${{ toJSON(needs) }}
        run: node .github/scripts/perimetre-ci.mjs synthese
      # Série verte qui a testé l'arbre (série complète) ou l'a dérivé d'un arbre attesté (série légère ou dédoublonnée
      # de `main`) : l'arbre est attesté, pour les séries de `main` qui suivront. Une série légère de pull request
      # n'atteste rien.
      - name: Attester l'arbre validé
        if: steps.verdict.outputs.attester == 'true'
        env:
          ARBRE: ${{ needs.perimetre.outputs.arbre }}
        run: printf '%s\n' "$ARBRE" > "$RUNNER_TEMP/arbre-valide.txt"
      - uses: actions/upload-artifact@v4
        if: steps.verdict.outputs.attester == 'true'
        with:
          name: serie-validee-${{ needs.perimetre.outputs.arbre }}
          path: ${{ runner.temp }}/arbre-valide.txt
          retention-days: 14
          overwrite: true
